[package]
name = "cookplans"
version = "0.1.0"
description = "Cooking Plans Weekly Smart"
edition = "2021"

[lib]
name = "cookplans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-alarm = {path='../tauri-plugin-alarm'}
tauri-plugin-alarm-scheduler = {path='../tauri-plugin-alarm-scheduler'}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
tauri-plugin-safe-area-insets-css = "0.2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
